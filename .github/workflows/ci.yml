name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    # macOS : OCR Apple Vision, police Arial Unicode et cible Apple Silicon.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      # Le test E2E (#[ignore]) demande les workers Python et les modèles : non lancé ici.
      - run: cargo test
