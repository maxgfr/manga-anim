name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    # macOS: Apple Vision OCR, Arial Unicode font and Apple Silicon target.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      # The E2E test (#[ignore]) needs the Python workers and models: not run here.
      - run: cargo test
