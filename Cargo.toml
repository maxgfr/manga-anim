[package]
name = "manga"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
hex = "0.4.3"
image = "0.25.10"
imageproc = "0.27.0"
indicatif = "0.18.6"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "fs"] }
toml = "1.1.8"
walkdir = "2.5.0"
zip = "9.1.0"

[dev-dependencies]
tempfile = "3.27.0"
